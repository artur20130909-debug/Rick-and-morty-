<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>AMBER ALERT — фан-ремейк</title>
<style>
:root{--amber:#ffb000;--amber2:#ff7a00;--red:#e8262b;--panel:rgba(16,18,24,.86);--line:rgba(255,255,255,.14);--txt:#f2f2f2;--dim:#9aa3b2;--ok:#36d16b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060a;color:var(--txt);font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#view,#view canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.65) 100%)}
#fx::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.5}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
#ui .scr{position:absolute;inset:0;display:none;pointer-events:auto}
#ui .scr.on{display:flex}
.hidden{display:none!important}
button,.btn{pointer-events:auto;font:800 15px/1 "Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.5px;color:#fff;background:#2b2f3a;border:2px solid rgba(255,255,255,.12);border-radius:10px;padding:13px 18px;cursor:pointer;text-transform:uppercase;transition:transform .08s,background .15s}
button:hover{background:#3a3f4d}button:active{transform:scale(.97)}
button.amber{background:linear-gradient(#ffc02e,#ff9500);color:#1a1000;border-color:#ffd56a}
button.red{background:linear-gradient(#ff4a4f,#c8161c);border-color:#ff8a8d}
button.green{background:linear-gradient(#43d97a,#1f9d4c);border-color:#8ff0b2}
button.ghost{background:rgba(255,255,255,.06)}
button:disabled{opacity:.45;cursor:default}
input,textarea{pointer-events:auto;font:600 16px "Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:#11141b;border:2px solid #333a48;border-radius:10px;padding:11px 13px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--amber)}
textarea{resize:none;font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
h1,h2,h3{margin:0}
.muted{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;background:rgba(10,12,16,.92);border:2px solid var(--amber);padding:10px 18px;border-radius:12px;font-weight:700;pointer-events:none;transition:opacity .3s}
/* сенсорное управление */
.tzone{position:absolute;inset:0;pointer-events:auto;touch-action:none}
.tstick{position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
.tknob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45)}
.tbtn{position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(20,22,30,.55);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;pointer-events:auto;touch-action:none}
.tbtn.on{background:rgba(255,176,0,.55)}
.tbtn.b-use{right:24px;bottom:96px;width:74px;height:74px;font-size:30px;background:rgba(255,176,0,.35)}
.tbtn.b-light{right:112px;bottom:30px}.tbtn.b-run{right:24px;bottom:16px;width:66px;height:66px}.tbtn.b-crouch{right:180px;bottom:22px}.tbtn.b-jump{right:112px;bottom:104px}.tbtn.b-lean{right:24px;bottom:190px;width:50px;height:50px;font-size:20px}.tbtn.b-item{right:190px;bottom:96px;width:62px;height:62px;background:rgba(232,38,43,.35)}.tbtn.b-slot{right:250px;bottom:30px;width:46px;height:46px;font-size:18px}
</style></head><body>
<div id="view"></div><div id="fx"></div><div id="ui"></div>
