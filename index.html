function house(X, w, wall, roof, doorX, smith) {

  PG([X - 14, wy, X + w + 14, wy, X + w - 30, top, X + 30, top], roof); for (let i = 1; i < 5; i++) LN(X - 14 + i * 11 * .6, wy - i * 12, X + w + 14 - i * 11 * .6, wy - i * 12, 'rgba(0,0,0,.15)', 1.5);

  const ws = smith ? [X + 30, X + 120, X + 250] : [X + 30, X + w - 90];
  for (const wx of ws) { windowW(wx, wy + 14, 46, 34, '#fff'); R(wx - 10, wy + 12, 7, 38, shade(roof, .2), OL, .7); R(wx + 49, wy + 12, 7, 38, shade(roof, .2), OL, .7); }
  if (smith) { windowW(X + 30, wy + 66, 46, 34, '#fff'); windowW(X + 120, wy + 66, 46, 34, '#fff'); }
